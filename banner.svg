<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="80" cy="50" r="1.6" opacity=".9"/><circle cx="190" cy="120" r="1.2" opacity=".6"/>
    <circle cx="300" cy="40" r="1.8" opacity=".8"/><circle cx="420" cy="90" r="1.2" opacity=".5"/>
    <circle cx="560" cy="35" r="1.5" opacity=".7"/><circle cx="700" cy="70" r="1.2" opacity=".6"/>
    <circle cx="820" cy="30" r="1.8" opacity=".9"/><circle cx="930" cy="110" r="1.3" opacity=".6"/>
    <circle cx="1040" cy="45" r="1.6" opacity=".8"/><circle cx="1130" cy="95" r="1.2" opacity=".5"/>
    <circle cx="140" cy="200" r="1.2" opacity=".5"/><circle cx="640" cy="150" r="1.1" opacity=".4"/>
  </g>
  <!-- lunar surface -->
  <path d="M0 285 Q150 262 320 278 T640 276 T960 280 T1200 270 V320 H0Z" fill="#2a2a3d"/>
  <path d="M0 300 Q200 285 420 297 T850 295 T1200 292 V320 H0Z" fill="#1a1a2a"/>
  <ellipse cx="240" cy="296" rx="34" ry="6" fill="#14141f"/>
  <ellipse cx="980" cy="298" rx="46" ry="7" fill="#14141f"/>
  <!-- landing pad flags -->
  <g stroke="#e5e7eb" stroke-width="2"><line x1="880" y1="282" x2="880" y2="250"/><line x1="1080" y1="282" x2="1080" y2="250"/></g>
  <path d="M880 250 L904 258 L880 266Z" fill="#facc15"/><path d="M1080 250 L1104 258 L1080 266Z" fill="#facc15"/>
  <!-- lander -->
  <g transform="translate(985 150)">
    <path d="M-10 62 L10 62 L4 130 L-4 130Z" fill="url(#flame)"/>
    <path d="M-30 40 L-52 78 M30 40 L52 78" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="-62" y1="78" x2="-42" y2="78" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="42" y1="78" x2="62" y2="78" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M-28 40 H28 L22 64 H-22Z" fill="#94a3b8"/>
    <rect x="-24" y="4" width="48" height="38" rx="10" fill="#e2e8f0"/>
    <circle cx="0" cy="22" r="9" fill="#38bdf8"/>
    <circle cx="-3" cy="19" r="3" fill="#fff" opacity=".7"/>
  </g>
  <!-- text -->
  <text x="70" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="14" fill="url(#title)">ORBITAL</text>
  <text x="74" y="188" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#c7d2fe" letter-spacing="3">LUNAR LANDER  ·  REINFORCEMENT LEARNING</text>
  <text x="74" y="232" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#94a3b8">PPO · reward shaping · reward hacking</text>
</svg>
